.content{position:relative;z-index:1;text-align:center;max-width:560px}
.logo-wrap{margin-bottom:2.5rem}
.logo-wrap img{height:52px;width:auto;opacity:.9}
.err-code{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.35em;text-transform:uppercase;color:var(--red);margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.75rem}
.err-code::before,.err-code::after{content:'';display:block;width:1.5rem;height:1px;background:var(--red)}
h1{font-size:clamp(3rem,8vw,7rem);font-weight:900;line-height:.88;letter-spacing:-.04em;margin-bottom:1.5rem}
h1 em{font-style:normal;color:var(--red)}
p{font-size:.95rem;color:var(--muted);line-height:1.8;max-width:400px;margin:0 auto 2.5rem}
.links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.btn-red{background:var(--red);color:white;padding:.85rem 1.75rem;border-radius:8px;font-size:.82rem;font-weight:600;text-decoration:none;transition:all .25s;display:inline-flex;align-items:center;gap:.5rem}
.btn-red:hover{background:#a50d23;transform:translateY(-2px);box-shadow:0 8px 30px rgba(200,16,46,.35)}
.btn-ghost{background:transparent;color:var(--light2);padding:.85rem 1.75rem;border-radius:8px;border:1px solid var(--border2);font-size:.82rem;font-weight:500;text-decoration:none;transition:all .25s;display:inline-flex;align-items:center;gap:.5rem}
.btn-ghost:hover{border-color:var(--light2);color:var(--light)}
.quick-links{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.ql{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.ql:hover{color:var(--light2)}
.big-num{position:fixed;font-size:40vw;font-weight:900;color:rgba(255,255,255,.02);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;letter-spacing:-.04em;z-index:0;white-space:nowrap}
</style>
